name: Education CRM + Apollo Quality

on:
  pull_request:
    paths:
      - "src/components/founder/outreach/ApolloCreditFirewallPanel.tsx"
      - "src/lib/__tests__/education*.test.ts"
      - "src/lib/manualArchitectureSync2026.ts"
      - "src/lib/liftorUserManualContent.ts"
      - "src/lib/slimMandyManualContent.ts"
      - "src/lib/founderManualContent.ts"
      - "supabase/functions/_shared/apolloCreditFirewall.ts"
      - "supabase/functions/_shared/education*.ts"
      - "supabase/functions/apollo-education-*/**"
      - "supabase/migrations/*education_crm_native.sql"
      - ".github/workflows/education-crm-apollo-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: education-crm-apollo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without changing lockfile
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Chat 1 targeted tests
        run: >-
          npx vitest run
          src/lib/__tests__/apolloCreditFirewall.test.ts
          src/lib/__tests__/educationRoleScorer.test.ts
          src/lib/__tests__/educationAccountUniverse.test.ts
          src/lib/__tests__/educationDiscoverySafety.test.ts
          src/lib/__tests__/educationCrm.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
