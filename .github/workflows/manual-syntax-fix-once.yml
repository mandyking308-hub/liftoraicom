name: One-use Manual Syntax Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-syntax-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escape Markdown backticks only inside Section 104
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/manualArchitectureSync2026.ts')
          s = p.read_text()
          start_marker = '## 104 Smartlead activation closeout (11 September 2026)'
          end_marker = '*End of Section 104 — Smartlead activation closeout.*'
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          section = s[start:end]
          # Escape Markdown code ticks for the surrounding TypeScript template literal.
          section = section.replace('`', '\\`')
          s2 = s[:start] + section + s[end:]
          p.write_text(s2)
          PY
      - name: Remove one-use workflows
        run: |
          git rm -f .github/workflows/manual-syntax-fix-once.yml
          if [ -f .github/workflows/manual-closeout-once.yml ]; then git rm -f .github/workflows/manual-closeout-once.yml; fi
      - name: Commit repaired current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/manualArchitectureSync2026.ts
          git commit -m "Fix canonical manual template syntax and remove one-use jobs"
          git pull --rebase origin main
          git push origin HEAD:main
