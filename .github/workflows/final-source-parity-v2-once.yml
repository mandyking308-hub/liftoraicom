name: One-use Final Source Parity v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-source-parity-v2-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reuse parity reconciliation and correct stale phrase assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/final-source-parity-once.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY", start)
          lines = wf[start:end].splitlines()
          # Remove the YAML run-block indentation from the embedded Python.
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/reconcile.py').write_text(script)
          PY
          python3 /tmp/reconcile.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/__tests__/winnrPostPurchase.test.ts')
          s = p.read_text()
          s = s.replace('expect(founderPage).toContain("has been purchased");', 'expect(founderPage).toContain("estate is purchased");')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Focused integration tests
        run: npx vitest run src/lib/__tests__/winnrPostPurchase.test.ts src/lib/__tests__/gsmSenderEstate.test.ts src/lib/__tests__/smartlead*.test.ts src/lib/__tests__/education*.test.ts src/lib/businessManuals/__tests__/businessManualRegistry.test.ts
      - name: Full test suite
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit reconciled source and remove both one-use parity jobs
        run: |
          git rm .github/workflows/final-source-parity-once.yml .github/workflows/final-source-parity-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/winnrClient.ts supabase/functions/gsm-winnr-sync/index.ts src/pages/founder/GSMOutbound.tsx src/lib/manualArchitectureSync2026.ts src/lib/__tests__/winnrPostPurchase.test.ts
          git commit -m "Reconcile Winnr entitlement source with live sender infrastructure"
          git pull --rebase origin main
          git push origin HEAD:main
