name: Billionaire research integrity

on:
  pull_request:
    paths:
      - "docs/billionaire-access-verification-*.md"
      - "scripts/validate-billionaire-access-research.mjs"
      - "scripts/validate-billionaire-reconciliation-migrations.mjs"
      - "supabase/migrations/*billionaire_access_research_2026*.sql"
      - ".github/workflows/billionaire-research-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "docs/billionaire-access-verification-*.md"
      - "scripts/validate-billionaire-access-research.mjs"
      - "scripts/validate-billionaire-reconciliation-migrations.mjs"
      - "supabase/migrations/*billionaire_access_research_2026*.sql"
      - ".github/workflows/billionaire-research-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all 3,428 research rows
        run: node scripts/validate-billionaire-access-research.mjs
      - name: Validate reconciliation migrations
        run: node scripts/validate-billionaire-reconciliation-migrations.mjs
