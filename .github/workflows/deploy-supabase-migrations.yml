name: Validate billionaire database migrations

# Liftor production uses Lovable Cloud's managed Postgres backend.
# GitHub is the canonical source for migration SQL; this workflow validates
# the payload but intentionally does not attempt an external Supabase CLI link.

on:
  pull_request:
    paths:
      - "docs/billionaire-access-verification-*.md"
      - "scripts/validate-billionaire-*.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "docs/billionaire-access-verification-*.md"
      - "scripts/validate-billionaire-*.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billionaire-database-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate research and migration payload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate all 3,428 research rows
        run: node scripts/validate-billionaire-access-research.mjs

      - name: Validate production migration payload
        run: node scripts/validate-billionaire-reconciliation-migrations.mjs
