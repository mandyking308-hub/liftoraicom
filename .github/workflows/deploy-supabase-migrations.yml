name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to Liftor production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: oiwbletmjhrhqksosphi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate completed research and migrations
        id: validate
        run: |
          node scripts/validate-billionaire-access-research.mjs
          node scripts/validate-billionaire-reconciliation-migrations.mjs

      - name: Check production deployment credentials
        id: credentials
        shell: bash
        run: |
          missing=0
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            missing=1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (or legacy PRODUCTION_DB_PASSWORD)"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install Supabase CLI
        id: setup
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Liftor production project
        id: link
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Preview pending migrations
        id: dry_run
        run: supabase db push --dry-run

      - name: Apply pending migrations
        id: apply
        run: supabase db push

      - name: Confirm migration history
        id: history
        run: supabase migration list

      - name: Publish production deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        shell: bash
        run: |
          state="failure"
          description="Supabase deployment failed; inspect the workflow run"

          if [[ "${VALIDATE_OUTCOME}" != "success" ]]; then
            description="Research or migration validation failed"
          elif [[ "${CREDENTIALS_OUTCOME}" != "success" ]]; then
            description="Blocked: missing Supabase production secrets"
          elif [[ "${SETUP_OUTCOME}" != "success" ]]; then
            description="Failed: Supabase CLI setup"
          elif [[ "${LINK_OUTCOME}" != "success" ]]; then
            description="Failed: Liftor Supabase project link"
          elif [[ "${DRY_RUN_OUTCOME}" != "success" ]]; then
            description="Failed: Supabase migration dry run"
          elif [[ "${APPLY_OUTCOME}" != "success" ]]; then
            description="Failed: Supabase migration apply"
          elif [[ "${HISTORY_OUTCOME}" != "success" ]]; then
            description="Failed: Supabase migration history check"
          else
            state="success"
            description="3,428-row reconciliation deployed and verified"
          fi

          gh api --method POST             "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state="${state}"             -f context="supabase-production"             -f description="${description}"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
