name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to Liftor production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: oiwbletmjhrhqksosphi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate completed research and migrations
        run: |
          node scripts/validate-billionaire-access-research.mjs
          node scripts/validate-billionaire-reconciliation-migrations.mjs

      - name: Check production deployment credentials
        shell: bash
        run: |
          missing=0
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            missing=1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (or legacy PRODUCTION_DB_PASSWORD)"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Liftor production project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Confirm migration history
        run: supabase migration list
