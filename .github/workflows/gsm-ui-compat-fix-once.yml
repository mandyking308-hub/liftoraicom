name: One-use GSM UI Compatibility Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gsm-ui-compat-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace ES2021-only replaceAll with target-safe equivalent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/founder/GSMOutbound.tsx')
          s = p.read_text()
          old = 'key.replaceAll("_", " ")'
          new = 'key.split("_").join(" ")'
          if old not in s:
              raise SystemExit('expected replaceAll expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove this one-use workflow and commit
        run: |
          git rm .github/workflows/gsm-ui-compat-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/founder/GSMOutbound.tsx
          git commit -m "Fix GSM outbound UI TypeScript target compatibility"
          git pull --rebase origin main
          git push origin HEAD:main
