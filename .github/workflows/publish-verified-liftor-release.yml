name: Publish verified Liftor release

on:
  push:
    branches:
      - automation/publish-liftor-final-7d01787b

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish exact verified release
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_THIN_SHA256="d28945ea30e76f09645b1b06849bfa65d6162b5949d59cd25244f4dfa0e83989"
          EXPECTED_RELEASE="7d01787b80d6afc399a153591988f887de918c63"
          EXPECTED_BASE="d68c93e9075c95c1c3f5ac651c9b1d1460dc64d1"
          EXPECTED_W2="6621c1fb2b539c5ea8469eee92338cd401af9299"
          EXPECTED_W4="e0c32882a488e923071a3354923030cc375fdfe1"
          TARGET_REF="refs/heads/release/liftor-final-20260928"
          THIN="liftor-final-thin.bundle"

          git fetch origin             refs/heads/main:refs/remotes/origin/main             refs/heads/recovery/worker2-rebuild-20260928:refs/remotes/origin/recovery/worker2-rebuild-20260928             refs/heads/recovery/worker4-rebuild-20260928:refs/remotes/origin/recovery/worker4-rebuild-20260928

          git cat-file -e "$EXPECTED_BASE^{commit}"
          git cat-file -e "$EXPECTED_W2^{commit}"
          git cat-file -e "$EXPECTED_W4^{commit}"

          cat             .release-artifact/liftor-final-thin.bundle.b64.part00             .release-artifact/liftor-final-thin.bundle.b64.part01             .release-artifact/liftor-final-thin.bundle.b64.part02             .release-artifact/liftor-final-thin.bundle.b64.part03             | base64 --decode > "$THIN"

          ACTUAL_SHA256="$(sha256sum "$THIN" | awk '{print $1}')"
          echo "Thin bundle SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_THIN_SHA256"

          git bundle verify "$THIN"

          git fetch "./$THIN" refs/heads/release-thin
          ACTUAL_RELEASE="$(git rev-parse FETCH_HEAD)"
          echo "Bundle release commit: $ACTUAL_RELEASE"
          test "$ACTUAL_RELEASE" = "$EXPECTED_RELEASE"

          git merge-base --is-ancestor "$EXPECTED_BASE" "$ACTUAL_RELEASE"
          git merge-base --is-ancestor "$EXPECTED_W2" "$ACTUAL_RELEASE"
          git merge-base --is-ancestor "$EXPECTED_W4" "$ACTUAL_RELEASE"

          git push origin "FETCH_HEAD:$TARGET_REF"

          git fetch origin "$TARGET_REF"
          REMOTE_RELEASE="$(git rev-parse FETCH_HEAD)"
          echo "Remote release commit: $REMOTE_RELEASE"
          test "$REMOTE_RELEASE" = "$EXPECTED_RELEASE"

          echo "Published exact verified Liftor release: $REMOTE_RELEASE"
