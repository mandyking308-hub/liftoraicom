name: One-use Smartlead Manual Closeout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-closeout-once.yml"

permissions:
  contents: write

jobs:
  reconcile-manuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Surgically reconcile canonical manuals
        shell: python
        run: |
          from pathlib import Path

          # ---------- Full Technical Manual ----------
          p = Path("src/lib/manualArchitectureSync2026.ts")
          s = p.read_text()
          s = s.replace(
              'export const ARCHITECTURE_SYNC_VERSION = "6.5 — GSM Outbound Infrastructure (10 September 2026)";',
              'export const ARCHITECTURE_SYNC_VERSION = "6.6 — Smartlead activation closeout (11 September 2026)";'
          )
          s = s.replace(
              'export const ARCHITECTURE_SYNC_PREVIOUS_VERSION = "6.3 — Smartlead & Sending Infrastructure (10 September 2026)";',
              'export const ARCHITECTURE_SYNC_PREVIOUS_VERSION = "6.5 — GSM Outbound Infrastructure (10 September 2026)";'
          )

          old_provider = '''- **Winnr** (`supabase/functions/gsm-winnr-sync`, paths isolated in
            `_shared/winnrClient.ts`, base `https://api.winnr.app/v1`, Bearer `WINNR_API_TOKEN`
            server-side only): read-only test, idempotent domain/mailbox sync into the registry, truthful
            401/403/429/error handling. Every mutation path defaults to preview and additionally requires an
            explicit external-action confirmation; provisioning stays disabled in this release. The GSM Winnr
            account does not exist yet, so no provider mutation is possible today.'''
          new_provider = '''- **Winnr** (`supabase/functions/gsm-winnr-sync`, paths isolated in
            `_shared/winnrClient.ts`, base `https://api.winnr.app/v1`, Bearer `WINNR_API_TOKEN`
            server-side only): founder-safe post-purchase test and idempotent domain/mailbox sync into the
            registry, with truthful 401/403/429/error handling. The Winnr estate has been purchased and the
            server-side API token is configured/reachable, but the canonical GSM registry deliberately remains
            empty until the purchased provider estate is successfully previewed and synced. Provisioning/purchase
            is not part of this endpoint. Warm-up is a separate explicit founder-confirmed action for already-
            synced GSM mailboxes only; no SMTP/IMAP/API credentials are persisted or returned.'''
          if old_provider in s:
              s = s.replace(old_provider, new_provider)

          old_surface = '''`/founder/gsm-outbound` shows live canonical state only: target 50, actual domains/mailboxes,
          Launch 30 and Evergreen 20 allocations, Winnr and Smartlead connection state, SMTP/IMAP counts,
          warming, campaign-ready, quarantined/retired, configured daily capacity, last provider sync, the
          actionable blocker, the Neon Candy exclusion, and the exact next setup action while
          `WINNR_API_TOKEN` is absent. Provider state and counts are never faked.'''
          new_surface = '''`/founder/gsm-outbound` shows live canonical state only: target 50, actual domains/mailboxes,
          Launch 30 and Evergreen 20 allocations, Winnr and Smartlead connection state, SMTP/IMAP counts,
          warming, campaign-ready, quarantined/retired, configured daily capacity, last provider sync, the
          actionable blocker and the Neon Candy exclusion. The purchased Winnr estate is not counted until a
          successful provider preview/sync returns it into the canonical registry. Provider state and counts are
          never faked.'''
          if old_surface in s:
              s = s.replace(old_surface, new_surface)

          old_onboarding = '''1. Create the GSM Winnr account. 2. Add `WINNR_API_TOKEN` as a server secret. 3. Purchase and
          verify up to 10 GSM sending domains. 4. Provision ~50 mailboxes and start warmup. 5. Sync into the
          registry. 6. Connect them in Smartlead and sync account status. 7. Allocate Launch 30 / Evergreen
          20. 8. Only then does sender readiness become true, and founder send approval remains separate.'''
          new_onboarding = '''1. Confirm the purchased Winnr estate is visible through the configured server-side API token.
          2. Run Test + Preview Sync, then explicitly confirm the idempotent registry sync. 3. Start the guarded
          slow warm-up only on successfully synced GSM mailboxes. 4. Connect the same accounts in Smartlead and
          run the read-only mailbox sync. 5. Configure the Smartlead webhook endpoint with the shared server
          secret. 6. Bind approved Liftor campaign shells only to existing unambiguous Smartlead campaigns.
          7. Run the zero-provider-mutation dry run. 8. Live sending remains blocked until the complete checklist
          is green and founder live-launch approval is separately recorded.'''
          if old_onboarding in s:
              s = s.replace(old_onboarding, new_onboarding)

          if "## 104 Smartlead activation closeout" not in s:
              section_104 = r'''

          ## 104 Smartlead activation closeout (11 September 2026)
          No parallel architecture was created. This section records the verified current truth of the existing
          Smartlead, inbox and GSM sending layers.

          ### 104.1 Idempotent campaign, lead and event mapping
          The existing `outbound_provider_campaign_mappings`, `outbound_provider_lead_mappings`,
          `outbound_provider_events` and `smartlead_activation_checklist` tables remain canonical. Live database
          indexes enforce one provider mapping per non-null Liftor campaign, unique provider-campaign identity,
          campaign idempotency tokens, unique Liftor contact/campaign lead mapping, unique provider lead identity
          and unique provider event idempotency keys. Ambiguous identity fails closed. Liftor mapping apply binds
          only to an existing unambiguous provider campaign; this closeout creates no Smartlead campaign.

          ### 104.2 Suppression and webhook return loop
          The shared sendability gate hard-blocks global suppression, hard bounce, unsubscribe and do-not-contact
          before any provider push. `smartlead-webhook` stores raw provenance plus deterministic idempotency,
          collapses duplicate events, maps only unambiguous identities, and only escalates CRM safety state on
          replies, hard bounces and unsubscribes. Unknown events are retained without transition. The receiver
          remains fail-closed while `SMARTLEAD_WEBHOOK_SECRET` is absent, and `webhook_configured` remains false
          until Smartlead is genuinely pointed at Liftor. `smartlead-webhook-status` exposes founder-safe readiness
          only and never returns the secret.

          ### 104.3 Exact activation checklist
          Exactly twelve keys are persisted per education business: `provider_connection`, `webhook_configured`,
          `campaign_mapping_ready`, `lead_mapping_ready`, `event_return_ready`, `sending_domains_ready`,
          `mailbox_estate_ready`, `warmup_ready`, `sender_caps_ready`, `suppression_sync_ready`,
          `first_end_to_end_test_ready`, `live_launch_approval`. Current live state across all four education
          businesses is 48 rows: provider connection and suppression sync ready; webhook, campaign mapping, lead
          mapping, event return, sending domains and first end-to-end test not ready; mailbox estate, warm-up,
          sender caps and founder live-launch approval blocked.

          ### 104.4 Bulk estate and zero-mutation dry run
          `mailbox-estate-register` supports founder/admin CSV/TSV preview then idempotent apply for many mailboxes
          at once. Fresh rows begin with provider/SMTP/IMAP/warm-up readiness false, conservative ramp defaults and
          business/estate segregation; legacy Neon Candy is protected and excluded. `smartlead-send-dry-run` is
          founder/admin only and never posts to Smartlead. Missing input, campaign mapping or contact returns a
          structured `decision: "BLOCKED"` and performs no database write. A resolvable rehearsal may write only a
          `smartlead_send_dry_run_audit` evidence row; it still performs no provider mutation.

          ### 104.5 Current live truth
          Smartlead is connected and read-only verification succeeds. Live state: 0 campaign mappings, 0 lead
          mappings, 0 provider events, 48 checklist rows, 0 GSM domains, 0 GSM mailboxes and 0 campaign-ready
          mailboxes. The four education campaign shells remain non-live, externally send-blocked, unapproved and
          unmapped. The purchased Winnr estate still has to be reconciled/synced into the canonical GSM registry,
          warmed, connected to Smartlead and returned through the webhook before founder live-launch approval can
          be considered. `hello@neoncandy.online` remains outside the GSM estate and excluded from allocation.

          *End of Section 104 — Smartlead activation closeout.*'''
              marker = "\n`;"
              if marker not in s:
                  raise SystemExit("Full manual closing marker not found")
              s = s.replace(marker, section_104 + marker, 1)
          p.write_text(s)

          # ---------- User Manual ----------
          p = Path("src/lib/liftorUserManualContent.ts")
          s = p.read_text()
          s = s.replace(
              'export const LIFTOR_USER_MANUAL_VERSION = "1.14 — GSM Outbound Infrastructure (10 September 2026)";',
              'export const LIFTOR_USER_MANUAL_VERSION = "1.15 — Smartlead activation closeout (11 September 2026)";'
          )
          s = s.replace(
              "no campaign links, no lead links, no events and no completed activation checklist",
              "no campaign links, no lead links and no events; the activation checklist now exists and truthfully shows the remaining blockers (see Section 115)"
          )

          old112 = '''There is a new page, Sending Infrastructure (/founder/sending-infrastructure). It shows a readiness checklist, your mailbox estate, and three safe buttons: refresh readiness, run a send dry run, and read the mailboxes already on the sending provider. Nothing on that page sends an email, creates a campaign at the provider, or spends any money. You can also paste a spreadsheet of up to hundreds of mailboxes, preview it, then apply it; applying the same list twice will not create duplicates. What is built behind it: one and only one link between a Liftor campaign and a provider campaign, one link per person per campaign, a single shared safety check that blocks anyone unsubscribed, bounced, on do-not-contact or suppressed, and a return loop that records replies, bounces and unsubscribes and immediately stops any further sending to that person. A repeated notification from the provider is recorded once and never applied twice. Anything the system does not recognise is stored quietly and changes nothing. What is NOT done: the provider webhook is not configured yet, there are no campaign links, no person links and no events, and the only mailboxes on file are the two old Neon Candy ones, which are locked to Neon Candy and cannot be used for education. YOUR ACTIONS TOMORROW: buy and verify the education sending domains, create and connect about 50 mailboxes at the provider, register them on the new page, start warmup, point the provider webhook at Liftor with the shared secret, then refresh readiness and run the dry run again. Nothing goes out until you record final approval.'''
          new112 = '''Sending Infrastructure (/founder/sending-infrastructure) shows the exact 12-item readiness checklist, mailbox estate, bulk mailbox preview/apply, readiness refresh, zero-provider-mutation send dry run and read-only provider mailbox discovery. Nothing on that page sends an email or starts a provider campaign. The campaign, lead and event links are idempotent and fail closed; anyone suppressed, hard-bounced, unsubscribed or on do-not-contact is blocked before a push, and repeated webhook events cannot apply twice. Current truth: Smartlead is connected, but the webhook is not configured, there are no campaign links, lead links or returned provider events, and there are zero GSM mailboxes ready to send. The Winnr estate has been purchased, but it is deliberately not counted until its provider data is successfully previewed/synced into Liftor. The two legacy Neon Candy inboxes remain locked out of education. The physical sequence now is: reconcile/sync the purchased Winnr estate, warm only synced GSM mailboxes, connect those same accounts in Smartlead, configure the webhook secret/endpoint, bind approved campaign shells to existing Smartlead campaigns, rerun the dry run, and only then consider founder live-launch approval.'''
          if old112 in s:
              s = s.replace(old112, new112)

          old114 = '''There is a new page, GSM Outbound Infrastructure (/founder/gsm-outbound). Read this instead of any older note that suggested each business gets its own mailboxes. The company owns ONE shared sending estate: about 50 mailboxes spread over up to 10 company-owned sending domains, roughly 5 mailboxes per domain. The businesses borrow capacity from it; they never own mailboxes. Two lanes: the Launch lane holds 30 mailboxes and is lent to whichever business is launching right now, and the Evergreen lane holds 20 for businesses already up and running, starting at 5 each for Billy and the Wild Forest, Aurelia, Kindnesss and Kingsbridge Global. If a mailbox is already in the middle of a conversation, it stays with that conversation — moving launch capacity never rewrites a live thread. A mailbox is not usable just because it exists: the domain must be verified, sending and receiving must both work, it must be connected at the sending provider, it must have finished warming up, and it must have a daily limit. Until all of that is true, the page shows exactly what is missing. The page also shows whether the mailbox provider (Winnr) and the sending provider are connected, and it never invents numbers. Right now there are zero company mailboxes, because the Winnr account does not exist yet — that is the truth, not an error. The old hello@neoncandy.online mailbox is marked as outside this estate and can never be used for the education businesses. WHAT YOU DO NEXT: create the Winnr account, give me its access token to store safely on the server, buy and verify the sending domains, create the mailboxes, start warmup, then allocate them to the lanes. Nothing on the page buys anything, creates a mailbox or sends an email today.'''
          new114 = '''GSM Outbound Infrastructure (/founder/gsm-outbound) is the one shared GSM-owned sender estate: target about 50 mailboxes across up to 10 GSM-controlled domains, with Launch 30 and Evergreen 20. Businesses borrow capacity; they do not own mailboxes. Sticky conversations keep their original sender. A mailbox is never usable merely because the provider has created it: the provider estate must be synced into Liftor, domain/DNS state must be known, SMTP and IMAP must be healthy, Smartlead must be connected, warm-up must be complete, health must pass and a safe daily/ramp cap must exist. The Winnr estate has now been purchased and its server-side token is configured/reachable, but the canonical GSM registry is still zero domains/zero mailboxes until a successful provider preview/sync proves the estate. The old hello@neoncandy.online mailbox is permanently outside this estate. The page now exposes founder-safe post-purchase controls for test/preview/sync, guarded warm-up, Smartlead mailbox sync, webhook readiness and safe pool allocation; none of those bypass the final live-send approval gate.'''
          if old114 in s:
              s = s.replace(old114, new114)

          if 'number: 115,' not in s:
              insert = '''  {\n    number: 115,\n    key: "smartlead-activation-truth",\n    title: "115. Sending activation — exactly where it stands now",\n    body: "The Smartlead activation checklist is now live and contains exactly 12 controls for each of Billy and the Wild Forest, Aurelia, Kindnesss and Kingsbridge Global. Two controls are ready today: the Smartlead connection works, and the shared suppression rule is enforced. Six are not ready: webhook configuration, campaign mapping, lead mapping, event return, sending domains and the first end-to-end rehearsal. Four are blocked: mailbox estate, warm-up, sender caps and your final live-launch approval. The rehearsal function is fail-closed: missing or synthetic details return BLOCKED and make no provider call or database mutation. A fully resolvable rehearsal may write only an audit evidence row and still never sends. The purchased Winnr estate must first be synced into the GSM registry, safely warmed and connected to Smartlead; the Smartlead webhook must then be configured with its server-side shared secret; campaign shells must be bound to existing provider campaigns; and the checklist must be refreshed. The four education campaign shells remain switched off, externally blocked, unapproved and unmapped. Neon Candy remains separate and unavailable to education. Nothing goes live until you explicitly approve live launch after all preceding gates are genuinely green.",\n  },\n'''
              needle = ']\n\nARCHITECTURE_SYNC_USER_SECTIONS.forEach'
              if needle not in s:
                  needle = '];\n\nARCHITECTURE_SYNC_USER_SECTIONS.forEach'
                  if needle not in s:
                      raise SystemExit("User manual section list closing marker not found")
                  s = s.replace(needle, insert + '];\n\nARCHITECTURE_SYNC_USER_SECTIONS.forEach', 1)
              else:
                  s = s.replace(needle, insert + ']\n\nARCHITECTURE_SYNC_USER_SECTIONS.forEach', 1)
          p.write_text(s)

      - name: Commit on top of latest main
        run: |
          git config user.name "mandyking308-hub"
          git config user.email "232562985+mandyking308-hub@users.noreply.github.com"
          git add src/lib/manualArchitectureSync2026.ts src/lib/liftorUserManualContent.ts
          if git diff --cached --quiet; then
            echo "No manual changes required."
            exit 0
          fi
          git commit -m "Reconcile Smartlead activation in canonical manuals"
          git pull --rebase origin main
          git push origin HEAD:main
